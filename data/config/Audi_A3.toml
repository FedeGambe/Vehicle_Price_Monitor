# Configurazione Audi A3
marca = "Audi"
modello = "A3"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
[siti]
"autoscout" = "audi/a3"
"automobile_it" = "audi/a3"
"subito_it" = "audi/a3"
"autosupermarket" = "audi/a3"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2020
anno_max = 2025

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = ["S", "RS"]
sport = ["S line"]
middle = ["Advanced", "Business Advanced", "Identity", "Sport", "Design"]
base = ["Business", "Business Plus"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
"s line" = "S line"
"s-line" = "S line"
"sline" = "S line"
"business advanced" = "Business Advanced"
"business plus" = "Business Plus"
"business" = "Business"
"advanced" = "Advanced"
"identity black" = "Identity"
"identity contrast" = "Identity"
"identity plus" = "Identity"
"identity" = "Identity"
"sport" = "Sport"
"design" = "Design"
"s" = "S"
"rs" = "RS"

# Sigla motorizzazione negli annunci -> nome standard
[motorizzazioni]
"30tfsi" = "30 TFSI"
"35tfsi" = "35 TFSI"
"40tfsi" = "40 TFSI"
"35tfsi mhev" = "35 TFSI MHEV"
"40tfsi mhev" = "40 TFSI MHEV"
"30tdi" = "30 TDI"
"35tdi" = "35 TDI"
"40tdi" = "40 TDI"
"45tfsi" = "45 TFSI"
"s3" = "S3"
"rs3" = "RS3"
"40tfsi e" = "40 TFSI e"
"45tfsi e" = "45 TFSI e"

# Cavalli per ogni motorizzazione (nome standard)
[mappa_cv]
"30 TFSI" = 110
"35 TFSI" = 150
"40 TFSI" = 190
"35 TFSI MHEV" = 150
"40 TFSI MHEV" = 190
"30 TDI" = 116
"35 TDI" = 150
"40 TDI" = 190
"40 TFSI e" = 204
"45 TFSI e" = 245
"45 TFSI" = 245
"S3" = 310
"RS3" = 400

# Configurazione Skoda Octavia
# Quarta serie (dal 2020), prima e dopo il restyling del 2024, berlina e Wagon
marca = "Skoda"
modello = "Octavia"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
[siti]
"autoscout" = "skoda/octavia"
"automobile_it" = "skoda/octavia"
"subito_it" = "skoda/octavia"
"autosupermarket" = "skoda/octavia"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
# Dal 2021: le immatricolazioni 2020 sono ancora in buona parte della terza serie
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2021
anno_max = 0

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = ["RS"]
sport = ["Sportline"]
middle = ["Style", "Executive", "Selection", "Scout", "Laurin & Klement"]
base = ["Active", "Ambition", "Business"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
" rs " = "RS"
" rs-" = "RS"
" rs," = "RS"
"sportline" = "Sportline"
"sport line" = "Sportline"
"laurin" = "Laurin & Klement"
"l&k" = "Laurin & Klement"
"executive" = "Executive"
"exec." = "Executive"
"selection" = "Selection"
"scout" = "Scout"
"style" = "Style"
"first edition" = "Style"
"ambition" = "Ambition"
"active" = "Active"
"business" = "Business"

# Sigla motorizzazione negli annunci -> nome standard
# Vince la chiave più lunga trovata nel titolo; i CV scritti nel titolo hanno comunque la precedenza su [mappa_cv]
[motorizzazioni]
"1.0 tsi" = "1.0 TSI"
"1.0 e-tec" = "1.0 e-TEC"
"1.5 tsi" = "1.5 TSI"
"1.5 e-tec" = "1.5 e-TEC"
"act hybrid" = "1.5 e-TEC"
"1.5 g-tec" = "1.5 G-TEC"
"g-tec" = "1.5 G-TEC"
"1.4 tsi" = "1.4 TSI iV"
"tsi iv" = "1.4 TSI iV"
"plug-in" = "1.4 TSI iV"
"2.0 tsi" = "2.0 TSI RS"
"2,0 tsi" = "2.0 TSI RS"
"2.0 tdi" = "2.0 TDI"
"2.0tdi" = "2.0 TDI"
"tdi" = "2.0 TDI"
"2.0 diesel" = "2.0 TDI"
"rs tsi" = "2.0 TSI RS"

# Cavalli per ogni motorizzazione (nome standard): la potenza più diffusa, usata se il titolo non indica i CV
[mappa_cv]
"1.0 TSI" = 110
"1.0 e-TEC" = 110
"1.5 TSI" = 150
"1.5 e-TEC" = 150
"1.5 G-TEC" = 130
"1.4 TSI iV" = 204
"2.0 TSI RS" = 245
"2.0 TDI" = 150

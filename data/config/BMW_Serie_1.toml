# Configurazione BMW Serie 1
marca = "BMW"
modello = "Serie 1"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
[siti]
"autoscout" = "bmw/serie-1"
"automobile_it" = "bmw/serie_1"
"subito_it" = "bmw/serie-1"
"autosupermarket" = "bmw/serie-1"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2020
anno_max = 2025

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = ["M"]
sport = ["M Sport"]
middle = ["Executive", "Luxury", "Sport Line"]
base = ["Edition", "Advantage", "Business"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
"m sport" = "M Sport"
"msport" = "M Sport"
"m-sport" = "M Sport"
"sport line" = "Sport Line"
"sport-line" = "Sport Line"
"advantage" = "Advantage"
"business" = "Business"
"sport" = "Sport Line"
"luxury" = "Luxury"
"executive" = "Executive"
"edition" = "Edition"
"m" = "M"

# Sigla motorizzazione negli annunci -> nome standard
[motorizzazioni]
"116i" = "116i"
"118i" = "118i"
"120i" = "120i"
"128ti" = "128ti"
"m135i" = "M135i xDrive"
"116d" = "116d"
"118d" = "118d"
"120d" = "120d"
"120dx" = "120d xDrive"
"m135ix" = "M135i xDrive"

# Cavalli per ogni motorizzazione (nome standard)
[mappa_cv]
"116i" = 109
"118i" = 136
"120i" = 178
"128ti" = 265
"M135i xDrive" = 306
"116d" = 116
"118d" = 150
"120d" = 190
"120d xDrive" = 190

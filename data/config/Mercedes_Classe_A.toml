# Configurazione Mercedes Classe A
marca = "Mercedes"
modello = "Classe A"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
[siti]
"autoscout" = "mercedes-benz/classe-a"
"automobile_it" = "mercedes_benz/classe_a"
"subito_it" = "mercedes/classe-a"
"autosupermarket" = "mercedes/classe-a"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2020
anno_max = 2025

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = ["AMG"]
sport = ["AMG line"]
middle = ["Progressive", "Advanced", "Elegance", "Sport"]
base = ["Business", "Executive"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
"amg line" = "AMG line"
"amg-line" = "AMG line"
"ameline" = "AMG line"
"premium" = "AMG line"
"amg" = "AMG"
"sport" = "Sport"
"business" = "Business"
"elegance" = "Elegance"
"advanced" = "Advanced"
"progressive" = "Progressive"
"executive" = "Executive"

# Sigla motorizzazione negli annunci -> nome standard
[motorizzazioni]
"a160" = "A 160"
"a180" = "A 180"
"a200" = "A 200"
"a220" = "A 220"
"a250" = "A 250"
"a35" = "A 35"
"a45" = "A 45"
"a45s" = "A 45 S"
"a160d" = "A 160 d"
"a180d" = "A 180 d"
"a200d" = "A 200 d"
"a220d" = "A 220 d"
"a250e" = "A 250 e"

# Cavalli per ogni motorizzazione (nome standard)
[mappa_cv]
"A 160" = 109
"A 180" = 136

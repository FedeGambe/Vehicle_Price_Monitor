# Configurazione Toyota Yaris
# Quarta serie (dal 2020), prima e dopo il restyling del 2024, compresa la GR Yaris (esclusa la Yaris Cross)
marca = "Toyota"
modello = "Yaris"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
[siti]
"autoscout" = "toyota/yaris"
"automobile_it" = "toyota/yaris"
"subito_it" = "toyota/yaris"
"autosupermarket" = "toyota/yaris"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
# Dal 2021: le immatricolazioni 2020 sono ancora in buona parte della terza serie
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2021
anno_max = 0

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = ["GR"]
sport = ["GR Sport"]
middle = ["Trend", "Lounge", "Style", "Premiere", "Premium", "Dynamic"]
base = ["Active", "Business", "Energy", "Icon"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
"gr sport" = "GR Sport"
"gr-sport" = "GR Sport"
" grs " = "GR Sport"
"gr yaris" = "GR"
"gr four" = "GR"
"circuit" = "GR"
" gr " = "GR"
"*gr*" = "GR"
"rovanpera" = "GR"
"premiere" = "Premiere"
"premium" = "Premium"
"lounge" = "Lounge"
"style" = "Style"
"trend" = "Trend"
"dynamic" = "Dynamic"
"active" = "Active"
"business" = "Business"
"energy" = "Energy"
"icon" = "Icon"

# Sigla motorizzazione negli annunci -> nome standard
# Vince la chiave più lunga trovata nel titolo; i CV scritti nel titolo hanno comunque la precedenza su [mappa_cv]
# Per le ibride si indica la potenza complessiva del sistema (alcuni siti riportano solo quella del motore termico)
[motorizzazioni]
"yaris 1.0" = "1.0 VVT-i"
"1.0 vvt" = "1.0 VVT-i"
"1.0 5 porte" = "1.0 VVT-i"
"1.0cc" = "1.0 VVT-i"
"1.0 active" = "1.0 VVT-i"
"1.5 tnga" = "1.5 Hybrid"
"gr circuit" = "GR Yaris 1.6"
"1.5h" = "1.5 Hybrid"
"1.5 hybrid" = "1.5 Hybrid"
"hybrid" = "1.5 Hybrid"
"1.5h 130" = "1.5 Hybrid 130"
"15h 130" = "1.5 Hybrid 130"
"hybrid 130" = "1.5 Hybrid 130"
"1.5 vvt" = "1.5 VVT-i"
"gr yaris" = "GR Yaris 1.6"
"1.6 turbo" = "GR Yaris 1.6"
"1.6 circuit" = "GR Yaris 1.6"
"gr four" = "GR Yaris 1.6"

# Cavalli per ogni motorizzazione (nome standard): la potenza più diffusa, usata se il titolo non indica i CV
[mappa_cv]
"1.0 VVT-i" = 72
"1.5 VVT-i" = 125
"1.5 Hybrid" = 116
"1.5 Hybrid 130" = 130
"GR Yaris 1.6" = 261

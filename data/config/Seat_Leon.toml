# Configurazione Seat Leon
# Quarta serie (dal 2020), prima e dopo il restyling del 2024, berlina e Sportstourer
marca = "Seat"
modello = "Leon"

# Percorso del modello su ogni sito, nel formato "marca/modello" (come compare nell'URL del sito)
# Subito non ha la pagina "seat/leon" (0 risultati): si cerca "leon" nel titolo degli annunci Seat
[siti]
"autoscout" = "seat/leon"
"automobile_it" = "seat/leon"
"subito_it" = "seat/?q=leon&qso=true"
"autosupermarket" = "seat/leon"

# Filtri di ricerca di default (sovrascrivibili da riga di comando). 0 = nessun limite
# Dal 2021: le immatricolazioni 2020 sono ancora in buona parte della terza serie
[ricerca]
prezzo_min = 3000
prezzo_max = 30000
km_min = 0
km_max = 0
anno_min = 2021
anno_max = 0

# Classificazione degli allestimenti per segmento
[allestimenti]
performance = []
sport = ["FR"]
middle = ["Xcellence", "Style"]
base = ["Reference", "Business"]

# Nomi trovati negli annunci -> nome standard dell'allestimento
[mappa_allestimenti]
"xcellence" = "Xcellence"
"excellence" = "Xcellence"
" fr " = "FR"
" fr-" = "FR"
"fr sport" = "FR"
"style" = "Style"
"stile" = "Style"
"reference" = "Reference"
"business" = "Business"
"bus." = "Business"

# Sigla motorizzazione negli annunci -> nome standard
# Vince la chiave più lunga trovata nel titolo; i CV scritti nel titolo hanno comunque la precedenza su [mappa_cv]
[motorizzazioni]
"1.0 tsi" = "1.0 TSI"
"1.0 etsi" = "1.0 eTSI"
"1.5 tsi" = "1.5 TSI"
"1.5 etsi" = "1.5 eTSI"
"1.5 hybrid" = "1.5 eTSI"
"1.5 tgi" = "1.5 TGI"
"1.0 mild hybrid" = "1.0 eTSI"
"1.5 mild hybrid" = "1.5 eTSI"
"ehybrid" = "e-Hybrid"
"e-hybrid" = "e-Hybrid"
"2.0 tsi" = "2.0 TSI"
"2.0 tdi" = "2.0 TDI"
"2.0 diesel" = "2.0 TDI"

# Cavalli per ogni motorizzazione (nome standard): la potenza più diffusa, usata se il titolo non indica i CV
[mappa_cv]
"1.0 TSI" = 110
"1.0 eTSI" = 110
"1.5 TSI" = 130
"1.5 eTSI" = 150
"1.5 TGI" = 130
"e-Hybrid" = 204
"2.0 TSI" = 190
"2.0 TDI" = 115
